<mat-form-field appearance="fill">
  <mat-label>Package Name</mat-label>
  <input type="text" matInput (keyup)="update()" [formControl]="packageControl" [matAutocomplete]="auto" />
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="valid = true">
    <mat-option *ngFor="let package of packages" [value]="package">
      {{ package }}
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
<button [disabled]="!valid" (click)="add(packageControl.value)" mat-button>add</button>
