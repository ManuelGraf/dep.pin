<mat-form-field appearance="fill">
  <mat-label>Package Name</mat-label>
  <input type="text" matInput [value]="query()" (input)="onInput($any($event.target).value)" [matAutocomplete]="auto" />
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selected.set($event.option.value)">
    @for (name of packages(); track name) {
      <mat-option [value]="name">{{ name }}</mat-option>
    }
  </mat-autocomplete>
</mat-form-field>
<button mat-button [disabled]="!selected()" (click)="add()">add</button>
