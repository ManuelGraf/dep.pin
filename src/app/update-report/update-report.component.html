<div class="report">
  @if (rows().length) {
    <div class="actions">
      <h3>Updates&nbsp;via&nbsp;NCU&nbsp; <mat-chip>{{ rows().length }}</mat-chip></h3>
      <button class="action-button" mat-button (click)="updateAll()">
        <mat-icon fontIcon="upgrade" /> Update All
      </button>
      <span class="flex-space"></span>
      <mat-form-field class="report__search">
        <input matInput type="search" (input)="filter.set($any($event.target).value)" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>

    <mat-table [dataSource]="dataSource" class="mat-elevation-z8">
      <ng-container matColumnDef="package">
        <mat-header-cell *matHeaderCellDef>Package</mat-header-cell>
        <mat-cell *matCellDef="let row" class="flex-cell">{{ row.package }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="before">
        <mat-header-cell *matHeaderCellDef>Current</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.before || 'N/A' }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="after">
        <mat-header-cell *matHeaderCellDef>Available</mat-header-cell>
        <mat-cell *matCellDef="let row">{{ row.after }}</mat-cell>
      </ng-container>

      <ng-container matColumnDef="update">
        <mat-header-cell *matHeaderCellDef>Update</mat-header-cell>
        <mat-cell *matCellDef="let row">
          <button mat-icon-button aria-label="update" (click)="update(row.package, row.after)">
            <mat-icon>upgrade</mat-icon>
          </button>
          @if (row.isMajorUpdate) {
            <button mat-icon-button class="major-update" matTooltip="This update involves a major version change" (click)="openChangelog(row)">
              <mat-icon>error</mat-icon>
            </button>
          } @else {
            <button mat-icon-button matTooltip="Show changelog" (click)="openChangelog(row)">
              <mat-icon>info</mat-icon>
            </button>
          }
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns" />
      <mat-row *matRowDef="let row; columns: displayedColumns" />
    </mat-table>

    @if (rows().length > 10) {
      <mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="10" showFirstLastButtons />
    }
  } @else {
    <p class="empty">
      <mat-icon fontIcon="check_circle" />
      no updates available.
    </p>
  }
</div>
