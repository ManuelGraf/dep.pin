<mat-toolbar color="primary" class="header animate-gradient" [ngClass]="{'play-animation':isLoading}">
  <!-- https://jossef.github.io/material-design-icons-iconfont/ -->
  <h2 class="logo"><mat-icon class="logo-icon" fontIcon="push_pin"></mat-icon>DEP<span class="wide">.</span>PIN</h2>
  <input type="file" (change)="onFileSelected($event)" />
</mat-toolbar>
<div style="margin: 20px;">
  <form [formGroup]="dependenciesForm">
    <mat-card *ngIf="package">
      <mat-card-header>
        <mat-toolbar>
          <span class="package__title">{{ package?.name }} &#64; {{package?.version}}
          </span>
          <span class="spacer"></span>
          <button 
            mat-icon-button 
            aria-label="show package JSON" 
            matTooltip="show JSON"
            (click)="showPackage = !showPackage"
          >
            <mat-icon>visibility</mat-icon>
          </button>
          <button 
            mat-icon-button 
            aria-label="npm audit" 
            matTooltip="audit"
            (click)="audit()"
          >
            <mat-icon>spellcheck</mat-icon>
          </button>
          <button matTooltip="Copy JSON" mat-icon-button aria-label="copy package.json to clipboard" (click)="copyJsonToClipboard()">
            <mat-icon>content_copy</mat-icon>
          </button>
        </mat-toolbar>
      </mat-card-header>
      <mat-card-content>
        <p>
          
        </p>
        <div>
          <ng-container *ngIf="auditResults">
            <mat-card-content>
              <app-audit-report [report]="auditResults">
              </app-audit-report>
            </mat-card-content>
          </ng-container>
        </div>
        <div class="json" *ngIf="showPackage">
          <pre>{{package | json}}</pre>
        </div>
        <mat-progress-spinner  color="accent" *ngIf="isLoading"></mat-progress-spinner>
      </mat-card-content>
    </mat-card>
    <mat-card *ngFor="let dep of $any(dependenciesForm.get('dependencies')).controls" [id]="dep.get('name').value">
      <mat-accordion>
        <mat-expansion-panel hideToggle>
          <mat-expansion-panel-header [ngClass]="{'error':dep.errors?.unmetDependencies}">
            <mat-panel-title> {{dep.get('name').value}} </mat-panel-title>
            <mat-icon class="peer-warning" *ngIf="dep.errors?.unmetDependencies" fontIcon="warning"></mat-icon>
            <mat-panel-description> {{dep.get('version').value }} </mat-panel-description>
          </mat-expansion-panel-header>
          <ng-template matExpansionPanelContent>
            <app-package-info 
              (versionChange)="onVersionChange(dep,$event)" 
              [name]="dep.get('name').value" 
              [dep]="dep" 
            ></app-package-info>
          </ng-template>
        </mat-expansion-panel>
      </mat-accordion>
    </mat-card>
  </form>
  <mat-card>
    <app-package-autocomplete *ngIf="package" (added)=onPackageAdded($event)></app-package-autocomplete>
  </mat-card>
  <div class="state">
    {{state | async}}
  </div>
  <!-- <div class="splash animate-gradient">
    <h2 class="logo"><mat-icon class="logo-icon" fontIcon="push_pin"></mat-icon>DEP<span class="wide">.</span>PIN</h2>
  </div> -->
</div>
